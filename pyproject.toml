[project]
name = "crcut"
version = "0.1.0"
description = "Auto-editor for Clash Royale TikTok videos"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
]

[project.optional-dependencies]
beats = ["librosa>=0.10.2"]

[project.scripts]
crcut = "crcut.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crcut"]

[tool.pytest.ini_options]
testpaths = ["tests"]
